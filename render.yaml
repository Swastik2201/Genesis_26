services:
  # ============================================================================
  # OPTION 1 (RECOMMENDED): Unified Full-Stack Web Service
  # Runs FastAPI + Uvicorn, serving both the REST/SSE API and the static web UI.
  # ============================================================================
  - type: web
    name: genesis-layamind
    env: python
    plan: free
    region: frankfurt # change to oregon, ohio, singapore, etc. as desired
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HF_HUB_DISABLE_XET
        value: "1"
