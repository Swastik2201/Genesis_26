<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LayaMind Dashboard — Live Laya decision viewer, forensic decision autopsy, replay, question lab, and calibration.">
  <title>LayaMind — Gamer HUD Dashboard</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="css/tokens.css?v=20261014_v5">
  <link rel="stylesheet" href="css/base.css?v=20261014_v5">
  <link rel="stylesheet" href="css/components.css?v=20261014_v5">
  <link rel="stylesheet" href="css/dashboard.css?v=20261014_v5">
  <link rel="stylesheet" href="css/live.css?v=20261014_v5">
  <link rel="stylesheet" href="css/autopsy.css?v=20261014_v5">
  <link rel="stylesheet" href="css/replay.css?v=20261014_v5">
  <link rel="stylesheet" href="css/panels.css?v=20261014_v5">
</head>
<body>
  <!-- Ambient Overlays -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-ambient" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="dashboard-layout">
    <!-- Fixed Left Navigation Bar -->
    <aside class="dashboard-sidebar" aria-label="Dashboard Navigation">
      <!-- Sidebar Header / Logo -->
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-brand" aria-label="Return to Landing Page">
          <span class="sidebar-brand-icon" aria-hidden="true">🎮</span>
          <span class="sidebar-brand-text">LayaMind</span>
        </a>
        <button id="btn-sidebar-collapse" class="sidebar-collapse-btn" aria-label="Hide navigation sidebar" title="Hide Navigation Sidebar">
          <span aria-hidden="true">◀</span>
          <span>HIDE</span>
        </button>
      </div>

      <!-- Global Session Picker -->
      <div class="sidebar-session-picker">
        <label for="session-select" class="session-select-label">WORLD / SESSION</label>
        <select id="session-select" class="session-select-input" aria-label="Select Game Run Session">
          <option value="demo-runner-20261013-001">Loading worlds...</option>
        </select>
      </div>

      <!-- Navigation Tabs -->
      <nav class="sidebar-nav" role="tablist">
        <div class="nav-item">
          <a href="#/overview" class="nav-link-btn" data-route="overview" id="nav-overview" aria-label="Overview Tab">
            <span class="nav-icon" aria-hidden="true">📊</span>
            <span class="nav-label">Overview</span>
          </a>
        </div>

        <div class="nav-item">
          <a href="#/live" class="nav-link-btn" data-route="live" id="nav-live" aria-label="Live Run Tab">
            <span class="nav-icon" aria-hidden="true">🎮</span>
            <span class="nav-label">Live Run</span>
          </a>
        </div>

        <div class="nav-item">
          <a href="#/autopsy" class="nav-link-btn" data-route="autopsy" id="nav-autopsy" aria-label="Decision Autopsy Tab">
            <span class="nav-icon" aria-hidden="true">🔍</span>
            <span class="nav-label">Autopsy</span>
          </a>
        </div>

        <div class="nav-item">
          <a href="#/lab" class="nav-link-btn" data-route="lab" id="nav-lab" aria-label="Question Lab Tab">
            <span class="nav-icon" aria-hidden="true">❓</span>
            <span class="nav-label">Question Lab</span>
          </a>
        </div>

        <div class="nav-item">
          <a href="#/replay" class="nav-link-btn" data-route="replay" id="nav-replay" aria-label="Replay Tab">
            <span class="nav-icon" aria-hidden="true">📼</span>
            <span class="nav-label">Replay</span>
          </a>
        </div>

        <div class="nav-item">
          <a href="#/calibration" class="nav-link-btn" data-route="calibration" id="nav-calibration" aria-label="Calibration Tab">
            <span class="nav-icon" aria-hidden="true">⭐</span>
            <span class="nav-label">Calibration</span>
          </a>
        </div>

        <div class="nav-item">
          <a href="#/logs" class="nav-link-btn" data-route="logs" id="nav-logs" aria-label="Logs Tab">
            <span class="nav-icon" aria-hidden="true">📜</span>
            <span class="nav-label">Logs</span>
          </a>
        </div>

        <div class="nav-item">
          <a href="#/about" class="nav-link-btn" data-route="about" id="nav-about" aria-label="About Tab">
            <span class="nav-icon" aria-hidden="true">ℹ️</span>
            <span class="nav-label">About</span>
          </a>
        </div>
      </nav>

      <!-- Sidebar Status Footer -->
      <div class="sidebar-footer">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: var(--text-muted); font-size: 10px;">SERVER:</span>
          <span id="server-status-badge" class="badge badge-cyan" style="font-size: 10px; padding: 2px 6px;">STANDBY</span>
        </div>
        <div id="demo-mode-badge" style="display: none;">
          <span class="badge badge-demo" style="width: 100%; justify-content: center; font-size: 10px;">DEMO ACTIVE</span>
        </div>
      </div>
    </aside>

    <!-- Top Telemetry Status Bar -->
    <header class="dashboard-topbar">
      <div class="topbar-left">
        <!-- Sidebar Restore Button (Displayed ONLY when sidebar is hidden) -->
        <button id="btn-sidebar-restore" class="sidebar-restore-btn" aria-label="Show navigation sidebar" title="Show Navigation Sidebar">
          <span>▶ SHOW</span>
        </button>

        <!-- Session ID & Game ID -->
        <div class="topbar-item">
          <span class="topbar-label">WORLD / SESSION</span>
          <span id="status-session" class="topbar-value" style="color: var(--neon-cyan); font-family: var(--font-mono); font-size: 13px;">
            demo-runner-20261013-001
          </span>
        </div>

        <div class="topbar-item">
          <span class="topbar-label">WORLD ADAPTER</span>
          <span id="status-game" class="topbar-value" style="font-family: var(--font-mono); font-size: 13px;">
            mock-runner-v1
          </span>
        </div>

        <!-- Telemetry Items -->
        <div class="topbar-telemetry-group">
          <div class="topbar-item">
            <span class="topbar-label">STEP</span>
            <span id="status-step" class="topbar-value" style="color: var(--text-primary);">
              0
            </span>
          </div>

          <div class="topbar-item">
            <span class="topbar-label">🪙 COINS / PTS</span>
            <span id="status-score" class="topbar-value" style="color: var(--mario-yellow);">
              000000
            </span>
          </div>

          <div class="topbar-item">
            <span class="topbar-label">LAYA LATENCY</span>
            <span id="status-latency" class="topbar-value" style="font-family: var(--font-mono);">
              -- ms
            </span>
          </div>
        </div>
      </div>

      <div class="topbar-right" style="display: flex; align-items: center; gap: var(--space-sm);">
        <!-- Sound Toggle Button (Pure Web Audio, OFF by default) -->
        <button id="btn-sound-toggle" class="sound-toggle-btn btn btn-ghost btn-sm" aria-label="Toggle Mario 8-bit sound effects" title="Toggle Mario synthesized Web Audio sound (OFF by default)">
          <span id="sound-icon" aria-hidden="true">🔇</span>
          <span id="sound-label">SFX: OFF</span>
        </button>

        <!-- LIVE Badge (pulses only when events are streaming) -->
        <span id="status-live-badge" class="badge badge-cyan" aria-live="polite">
          ★ STANDBY
        </span>

        <a href="index.html" class="btn btn-ghost btn-sm" aria-label="Exit to landing page">
          <span>EXIT</span>
        </a>
      </div>
    </header>

    <!-- Accessible screen-reader live region (polite, throttled announcements) -->
    <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <!-- Main Content Panel Area (Swapped without page reload via router.js) -->
    <main class="dashboard-main" id="panel-container" role="main" aria-live="polite">
      <!-- Mounted active panel renders here -->
    </main>
  </div>

  <!-- Dashboard Boot Script -->
  <script type="module">
    import { initRouter } from './js/router.js?v=20261016_v6';
    import { store } from './js/store.js?v=20261016_v6';
    import * as api from './js/api.js?v=20261016_v6';
    import { gameConfig } from './config.js?v=20261016_v6';
    import * as sound from './js/sound.js?v=20261016_v6';
    import { initParticleBackground, triggerMarioCoinPop, triggerMarioBlockBump } from './js/fx.js?v=20261016_v6';

    document.addEventListener('DOMContentLoaded', async () => {
      const panelContainer = document.getElementById('panel-container');
      const sessionSelect = document.getElementById('session-select');
      const statusSession = document.getElementById('status-session');
      const statusGame = document.getElementById('status-game');
      const statusStep = document.getElementById('status-step');
      const statusScore = document.getElementById('status-score');
      const statusLatency = document.getElementById('status-latency');
      const statusLiveBadge = document.getElementById('status-live-badge');
      const serverStatusBadge = document.getElementById('server-status-badge');
      const soundBtn = document.getElementById('btn-sound-toggle');
      const soundIcon = document.getElementById('sound-icon');
      const soundLabel = document.getElementById('sound-label');
      const announcer = document.getElementById('live-announcer');

      // 0. Apply Central Game Configuration from web/config.js
      if (statusGame && gameConfig.gameId) {
        statusGame.textContent = gameConfig.gameId;
      }
      const brandText = document.querySelector('.sidebar-brand-text');
      if (brandText) {
        brandText.textContent = gameConfig.brandName || 'LayaMind';
      }

      // Initialize ambient particles (capped, rAF, pauses when hidden)
      initParticleBackground('.bg-ambient');

      // 1. Initialize client-side hash router
      initRouter(panelContainer);

      // 2. Handle ?run=<session> or ?session=<session> query parameter
      const urlParams = new URLSearchParams(window.location.search);
      const requestedSession = urlParams.get('run') || urlParams.get('session');
      if (requestedSession) {
        store.setSession(requestedSession);
      }

      // 3. Sound Toggle Button Handler
      if (soundBtn) {
        function updateSoundUI() {
          const enabled = sound.isSoundEnabled();
          soundIcon.textContent = enabled ? '🔊' : '🔇';
          soundLabel.textContent = enabled ? 'SFX: ON' : 'SFX: OFF';
          if (enabled) soundBtn.classList.add('sound-active');
          else soundBtn.classList.remove('sound-active');
        }
        updateSoundUI();

        soundBtn.addEventListener('click', () => {
          const newState = sound.toggleSound();
          updateSoundUI();
          triggerMarioBlockBump(soundBtn);
          if (newState) {
            triggerMarioCoinPop(soundBtn, 'SFX ON');
          }
        });
      }

      // 4. Keyboard Navigation for Sidebar Navigation Tabs
      const navLinks = Array.from(document.querySelectorAll('.sidebar-nav .nav-link-btn'));
      navLinks.forEach((link, idx) => {
        link.setAttribute('tabindex', '0');
        link.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            const nextIdx = (idx + 1) % navLinks.length;
            navLinks[nextIdx].focus();
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            const prevIdx = (idx - 1 + navLinks.length) % navLinks.length;
            navLinks[prevIdx].focus();
          } else if (e.key === 'Home') {
            e.preventDefault();
            navLinks[0].focus();
          } else if (e.key === 'End') {
            e.preventDefault();
            navLinks[navLinks.length - 1].focus();
          }
        });
      });

      // 5. Check health and determine demo / mock status
      let isMockActive = api.isMock();
      try {
        const healthData = await api.health();
        isMockActive = healthData.mode === 'mock_demo' || api.isMock();
        if (serverStatusBadge) {
          serverStatusBadge.textContent = isMockActive ? 'DEMO / MOCK' : 'ONLINE';
          serverStatusBadge.className = `badge ${isMockActive ? 'badge-demo' : 'badge-good'}`;
        }
      } catch (err) {
        console.warn('Health check failed; activating demo fallback mode.', err);
        isMockActive = true;
        api.setMockMode(true);
      }

      // Inject / Show Top Demo Mode Ribbon if server unreachable or mock active
      renderDemoModeRibbon(isMockActive);

      // 6. Load available runs and populate global session picker
      try {
        const sessionRuns = await api.runs();
        if (Array.isArray(sessionRuns) && sessionRuns.length > 0) {
          store.setSessions(sessionRuns);
          sessionSelect.innerHTML = sessionRuns.map(r => `
            <option value="${r.session_id}" ${r.session_id === (requestedSession || store.getState().currentSession) ? 'selected' : ''}>
              ${r.session_id} (${r.final_score ?? 0} pts)
            </option>
          `).join('');

          // Select requested session or default to first
          const targetSession = requestedSession || sessionRuns[0].session_id;
          store.setSession(targetSession);
        }
      } catch (err) {
        console.error('Failed to load runs:', err);
      }

      // Handle session dropdown changes
      sessionSelect.addEventListener('change', (e) => {
        const selectedId = e.target.value;
        store.setSession(selectedId);
      });

      // 7. Subscribe to Store updates to reflect telemetry in Topbar and Screen Reader
      let lastAnnounceTime = 0;
      store.subscribe((state) => {
        if (statusSession) statusSession.textContent = state.currentSession || 'latest';
        if (statusGame) statusGame.textContent = state.gameId || gameConfig.gameId;
        if (statusStep) statusStep.textContent = state.stepCount;
        if (statusScore) statusScore.textContent = `${state.score} PTS`;
        if (statusLatency) {
          statusLatency.textContent = state.latencyMs ? `${state.latencyMs.toFixed(1)} ms` : '-- ms';
        }

        // Pulsing LIVE badge only when actively streaming
        if (statusLiveBadge) {
          if (state.isStreaming) {
            statusLiveBadge.className = 'badge badge-live';
            statusLiveBadge.textContent = 'LIVE STREAM';
          } else {
            statusLiveBadge.className = 'badge badge-cyan';
            statusLiveBadge.textContent = state.status === 'completed' ? 'COMPLETED' : 'STANDBY';
          }
        }

        // Screen reader announcement (throttled to at most once per 1.5 seconds)
        if (announcer && state.latestEvent) {
          const now = Date.now();
          if (now - lastAnnounceTime > 1500) {
            lastAnnounceTime = now;
            const ev = state.latestEvent;
            announcer.textContent = `Step ${ev.step}: Action ${ev.final_action || 'none'}. Score: ${state.score} points. ${ev.outcome || ''}`;
          }
        }
      });

      function renderDemoModeRibbon(active) {
        let ribbon = document.getElementById('demo-mode-top-ribbon');
        if (active) {
          if (!ribbon) {
            ribbon = document.createElement('div');
            ribbon.id = 'demo-mode-top-ribbon';
            ribbon.className = 'demo-mode-top-ribbon';
            ribbon.setAttribute('role', 'status');
            ribbon.innerHTML = `
              <div class="demo-ribbon-content">
                <span class="demo-ribbon-badge">⚡ DEMO MODE</span>
                <span class="demo-ribbon-text">
                  REPLAYING RECORDED RUN // Standalone demonstration fixtures active (Server unreachable)
                </span>
              </div>
              <div style="display: flex; gap: 8px; align-items: center;">
                <button id="btn-demo-retry" class="btn btn-secondary btn-xs" style="padding: 2px 8px; font-size: 10px;">RETRY SERVER</button>
                <button id="btn-demo-dismiss" style="background: none; border: none; color: #fff; cursor: pointer; font-size: 14px;" aria-label="Dismiss banner">✕</button>
              </div>
            `;
            document.body.insertBefore(ribbon, document.body.firstChild);

            // Re-adjust topbar and main top positions slightly to accommodate ribbon
            const topbar = document.querySelector('.dashboard-topbar');
            if (topbar) topbar.style.top = `${ribbon.offsetHeight}px`;
            const main = document.querySelector('.dashboard-main');
            if (main) main.style.marginTop = `${60 + ribbon.offsetHeight}px`;

            const retryBtn = ribbon.querySelector('#btn-demo-retry');
            if (retryBtn) {
              retryBtn.addEventListener('click', () => {
                window.location.search = '';
              });
            }

            const dismissBtn = ribbon.querySelector('#btn-demo-dismiss');
            if (dismissBtn) {
              dismissBtn.addEventListener('click', () => {
                ribbon.style.display = 'none';
                if (topbar) topbar.style.top = '0';
                if (main) main.style.marginTop = '60px';
              });
            }
          }
        } else if (ribbon) {
          ribbon.style.display = 'none';
        }
      }

      // Sidebar Collapse & Restore Controller
      const sidebarCollapseBtn = document.getElementById('btn-sidebar-collapse');
      const sidebarRestoreBtn = document.getElementById('btn-sidebar-restore');
      const layoutContainer = document.querySelector('.dashboard-layout');

      if (layoutContainer) {
        function setSidebarState(collapsed) {
          layoutContainer.classList.toggle('sidebar-collapsed', collapsed);
          localStorage.setItem('beat_the_bot_sidebar_collapsed', String(collapsed));
        }

        const initialCollapsed = localStorage.getItem('beat_the_bot_sidebar_collapsed') === 'true';
        setSidebarState(initialCollapsed);

        if (sidebarCollapseBtn) {
          sidebarCollapseBtn.addEventListener('click', () => setSidebarState(true));
        }
        if (sidebarRestoreBtn) {
          sidebarRestoreBtn.addEventListener('click', () => setSidebarState(false));
        }
      }
    });
  </script>
</body>
</html>
